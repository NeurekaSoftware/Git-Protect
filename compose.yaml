services:
  git-backup:
    image: ghcr.io/neurekadev/git-backup:edge
    container_name: git-backup
    env_file:
      - .env
    # The binary starts as root only long enough to take ownership of /app/data
    # for PUID:PGID and drop root permanently. It keeps just the capabilities
    # that startup step needs; the drop clears them before any work begins.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - git-backup
    volumes:
      - data:/app/data
      # Mount the config directory, not the file: a single-file bind mount pins the container to the
      # original inode, so host edits saved by write-and-rename never reach the container and hot reload
      # silently does nothing. A directory mount lets the container see every edit.
      - ./config:/app/config:ro
    restart: unless-stopped

networks:
  git-backup:
    name: git-backup

volumes:
  data:
