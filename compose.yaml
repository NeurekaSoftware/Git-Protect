services:
  git-backup:
    image: ghcr.io/neurekadev/git-backup:edge
    container_name: git-backup
    env_file:
      - .env
    # The image is a standalone static binary with no entrypoint shell, so the
    # container runs directly as PUID:PGID (defaults from .env). Both values
    # must exist on the host volume; changing them later needs a one-time
    # chown of the data volume.
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - git-backup
    volumes:
      - data:/app/data
      # Mount the config directory, not the file: a single-file bind mount pins the container to the
      # original inode, so host edits saved by write-and-rename never reach the container and hot reload
      # silently does nothing. A directory mount lets the container see every edit.
      - ./config:/app/config:ro
    restart: unless-stopped

networks:
  git-backup:
    name: git-backup

volumes:
  data:
